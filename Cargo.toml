[package]
name = "herdr-agent-diff"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Read-only filesystem changes viewer for Herdr agent panes"
license = "MIT"

[dependencies]
crossterm = "0.29"
ignore = "0.4"
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
thiserror = "2"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3"
toml = "0.9"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
